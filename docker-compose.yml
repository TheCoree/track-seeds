# Сервер: docker compose up -d --build   (первый раз — deploy/setup.sh)
# Дробилки вшиты в образ; в ./config — пароли камер и что меняли в интерфейсе (см. README).
services:
  track-seeds:
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}  # владелец ./config на хосте: id -u (deploy/setup.sh пишет его в .env)
    image: track-seeds:latest
    # Поднимается сам: после перезагрузки и пропадания питания (служба docker включена в автозапуск),
    # после падения процесса; «docker compose stop» до перезагрузки не мешает — на проде он нужен всегда.
    restart: always
    # сеть хоста: камеры в локальной сети видны как есть; веб — на WEB_HOST:WEB_PORT сервера,
    # пускает из WEB_ALLOWED_NETWORKS (по умолчанию локальная сеть), вход — разработчик (admin, WEB_PASSWORD)
    # и клиенты по приглашениям; панель разработчика — только из WEB_ADMIN_NETWORKS
    network_mode: host
    env_file: .env
    volumes:
      - ./config:/app/config  # пароли камер, оповещения, свои эталоны — то, что переносится с ПК
      - data:/app/data        # журнал событий, снимки, кеш голоса, отчёты о работе, аккаунты клиентов
    # Сервер 2 ядра / 4 ГБ: обычно ~0.1 ядра и ~400 МБ; потолок — чтобы сбой не съел всю память
    mem_limit: 1500m
    # Физический динамик, подключённый к серверу (aplay). Номер группы audio на хосте:
    # getent group audio | cut -d: -f3
    # devices:
    #   - /dev/snd:/dev/snd
    # group_add:
    #   - "${AUDIO_GID:-29}"
    stop_grace_period: 60s  # дослать уведомления и договорить фразу
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # HTTPS из интернета: запускается, только если в .env задан DOMAIN (deploy/setup.sh пишет
  # COMPOSE_PROFILES=domain — тогда и «docker compose up -d» поднимает Caddy вместе с сайтом).
  # Caddy — из Debian, в нашем же образе: с сервера Docker Hub бывает недоступен (образ caddy:2
  # скачивался бесконечно), а apt работает — им ставится всё остальное.
  caddy:
    image: track-seeds:latest
    pull_policy: never  # образ собирает сервис track-seeds; из интернета его не скачать
    profiles: [domain]
    restart: always
    user: "0:0"  # порты 80 и 443; сайт по-прежнему работает не от root
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    healthcheck:
      disable: true  # проверка образа — про сайт, а не про Caddy
    # Сеть хоста обязательна: Caddy ходит на 127.0.0.1:8080, и сайт берёт адрес посетителя из
    # X-Forwarded-For. В отдельной docker-сети все посетители пришли бы с 172.x — сайт счёл бы их
    # локальной сетью и показал бы им панель разработчика.
    network_mode: host
    environment:  # только это, не весь .env: Caddy не нужны пароли
      DOMAIN: ${DOMAIN:-}
      WEB_PORT: ${WEB_PORT:-8080}
      XDG_DATA_HOME: /data  # сертификаты — в томе caddy-data
      XDG_CONFIG_HOME: /config
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data  # сертификаты: при обновлении не теряются (Let's Encrypt ограничивает выпуск)
      - caddy-config:/config
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
  caddy-data:
  caddy-config:
